      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "8473ba2145ff7b2d879b1174bfb23371", "console": [], "id": "setup", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "35d342d44450c9a37c14ad4cbb1a1eec", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"drug-target-interaction-dti-prediction\"\u003EDrug-Target Interaction (DTI) Prediction\u003C/h1\u003E\n\u003Ch3 id=\"dataset-exploration-baseline-establishment\"\u003EDataset Exploration \u0026amp; Baseline Establishment\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPredicting interactions between drugs and target proteins is a crucial step in modern \u003Cem\u003Ein silico\u003C/em\u003E drug discovery. This notebook serves as an interactive environment to inspect data quality and establish a model baseline.\u003C/span\u003E\n\u003Ch2 id=\"core-notebook-goals\"\u003ECore Notebook Goals:\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EExplore the Dataset:\u003C/strong\u003E Investigate DTI interaction networks, Morgan drug structure fingerprints, protein sequence CTD descriptors, and Knowledge Graph relation triples within the \u003Ccode\u003Edata/yamanishi_08\u003C/code\u003E directory.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEstablish a Baseline:\u003C/strong\u003E Construct and validate a robust Random Forest classifier baseline to predict drug-target interactions across cross-validation splits.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "35d342d44450c9a37c14ad4cbb1a1eec", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"drug-target-interaction-dti-prediction\"\u003EDrug-Target Interaction (DTI) Prediction\u003C/h1\u003E\n\u003Ch3 id=\"dataset-exploration-baseline-establishment\"\u003EDataset Exploration \u0026amp; Baseline Establishment\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPredicting interactions between drugs and target proteins is a crucial step in modern \u003Cem\u003Ein silico\u003C/em\u003E drug discovery. This notebook serves as an interactive environment to inspect data quality and establish a model baseline.\u003C/span\u003E\n\u003Ch2 id=\"core-notebook-goals\"\u003ECore Notebook Goals:\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EExplore the Dataset:\u003C/strong\u003E Investigate DTI interaction networks, Morgan drug structure fingerprints, protein sequence CTD descriptors, and Knowledge Graph relation triples within the \u003Ccode\u003Edata/yamanishi_08\u003C/code\u003E directory.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEstablish a Baseline:\u003C/strong\u003E Construct and validate a robust Random Forest classifier baseline to predict drug-target interactions across cross-validation splits.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a9a85941b06d3ba1d8b57d68b2913edf", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e229c542ba570b36141fa1bb4b72c56c", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-visualizing-dataset-shapes-and-structures\"\u003E1. Visualizing Dataset Shapes and Structures\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Ccode\u003Eyamanishi_08\u003C/code\u003E dataset includes: positive Drug-Target Interactions (DTIs), drug structures and precomputed chemical fingerprints, protein sequences and CTD sequence descriptors, and Knowledge Graph (KG) relation triples.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "93ab1c6a6525d4467e5f7c840991ba27", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"11-drug-target-interactions-dt_all_08txt\"\u003E1.1 Drug-Target Interactions (\u003Ccode\u003Edt_all_08.txt\u003C/code\u003E)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThis file defines the gold-standard bipartite drug-target interaction (DTI) network from the Yamanishi 08 benchmark dataset.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EData Format\u003C/strong\u003E: Tab/whitespace-separated values with 3 columns:\u003Col\u003E\n\u003Cli\u003E\u003Ccode\u003Edrug_id\u003C/code\u003E: Bipartite node representing the drug compound (e.g., \u003Ccode\u003ED00002\u003C/code\u003E, KEGG Drug ID).\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Erelation\u003C/code\u003E: Always set to \u003Ccode\u003EDRUG_TARGET\u003C/code\u003E, defining the positive interaction link.\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Etarget_id\u003C/code\u003E: Bipartite node representing the target protein (e.g., \u003Ccode\u003Ehsa:10\u003C/code\u003E, KEGG Gene ID).\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMachine Learning Context\u003C/strong\u003E: These pairs serve as the positive class ground-truth labels for DTI binary classification or link prediction tasks. All unobserved edges are generally treated as negative samples during baseline model training.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c670d2859ce0cbea8c6de4fd2ac60036", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8dc90f0198294dee2c2c72875940f685", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"dti-dataset-summary-statistics\"\u003EDTI Dataset Summary Statistics\u003C/h3\u003E\u003C/span\u003E\u003Cmarimo \u0026#92;\u0026quot;:9,\u0026#92;\u0026quot;pro_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;hsa:1022\u0026#92;\u0026quot;,\u0026#92;\u0026quot;seq\u0026#92;\u0026quot;:\u0026#92;\u0026quot;MALDVKSRAKRYEKLDFLGEGQFATVYKARDKNTNQIVAIKKIKLGHRSEAKDGINRTALREIKLLQELSHPNIIGLLDAFGHKSNISLVFDFMETDLEVIIKDNSLVLTPSHIKAYMLMTLQGLEYLHQHWILHRDLKPNNLLLDENGVLKLADFGLAKSFGSPNRAYTHQVVTRWYRAPELLFGARMYGVGVDMWAVGCILAELLLRVPFLPGDSDLDQLTRIFETLGTPTEEQWPDMCSLPDYVTFKSFPGIPLHHIFSAAGDDLLDLIQGLFLFNPCARITATQALKMKYFSNRPGPTPGCQLPRPNCPVETLKEQSNPALAIKRKRTEALEQGGLPKKLIF\u0026#92;\u0026quot;,\u0026#92;\u0026quot;seq_length\u0026#92;\u0026quot;:346}]\u0026quot;' data-total-rows='10' data-size-bytes='4821' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;pro_id\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;seq\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;seq_length\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]]]' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='true' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "754ad3386a0ab451d478fcc74276e3a0", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ETo understand the 147-dimensional \u003Cstrong\u003ECTD (Composition, Transition, and Distribution)\u003C/strong\u003E descriptor, let us examine the CTD representation for the first protein in our dataset (shape: \u003Ccode\u003E(147,)\u003C/code\u003E).\u003C/span\u003E\n\u003Ch4 id=\"1-shape-breakdown\"\u003E\u003Cstrong\u003E1. Shape Breakdown\u003C/strong\u003E\u003C/h4\u003E\n\u003Cspan class=\"paragraph\"\u003EThe 147 features represent three types of global sequence descriptors across 7 physical/chemical properties:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EComposition (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(C||)\u003C/marimo-tex\u003E - indices 0 to 20; 21 dims):\u003C/strong\u003E The global percentage/fraction of amino acids belonging to a specific group (e.g., polar, neutral, hydrophobic) under 7 properties (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(7 \\times 3 = 21||)\u003C/marimo-tex\u003E dimensions).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETransition (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E - indices 21 to 41; 21 dims):\u003C/strong\u003E The transition frequency between adjacent amino acids of different groups (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(7 \\times 3 = 21||)\u003C/marimo-tex\u003E dimensions).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDistribution (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(D||)\u003C/marimo-tex\u003E - indices 42 to 146; 105 dims):\u003C/strong\u003E The relative positioning along the sequence (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0\\%||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(25\\%||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(50\\%||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(75\\%||)\u003C/marimo-tex\u003E, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(100\\%||)\u003C/marimo-tex\u003E) for each group (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(7 \\times 3 \\times 5 = 105||)\u003C/marimo-tex\u003E dimensions).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch4 id=\"2-value-ranges-numerical-observations\"\u003E\u003Cstrong\u003E2. Value Ranges \u0026amp; Numerical Observations\u003C/strong\u003E\u003C/h4\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EComposition (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(C||)\u003C/marimo-tex\u003E):\u003C/strong\u003E Range of values: \u003Ccode\u003E[0.097, 0.786]\u003C/code\u003E. These are fractions in the range \u003Cmarimo-tex class=\"arithmatex\"\u003E||([0.0, 1.0]||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETransition (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E):\u003C/strong\u003E Range of values: \u003Ccode\u003E[0.021, 0.263]\u003C/code\u003E. These are transition frequencies/probabilities, also in the range \u003Cmarimo-tex class=\"arithmatex\"\u003E||([0.0, 1.0]||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDistribution (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(D||)\u003C/marimo-tex\u003E):\u003C/strong\u003E Range of values: \u003Ccode\u003E[0.345, 100.000]\u003C/code\u003E. These represent position percentages along the primary sequence and are defined in the range \u003Cmarimo-tex class=\"arithmatex\"\u003E||([0.0, 100.0]||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EScale Discrepancy:\u003C/strong\u003E The \u003Cmarimo-tex class=\"arithmatex\"\u003E||(C||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(T||)\u003C/marimo-tex\u003E features are in \u003Cmarimo-tex class=\"arithmatex\"\u003E||([0, 1]||)\u003C/marimo-tex\u003E, whereas the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(D||)\u003C/marimo-tex\u003E features are in \u003Cmarimo-tex class=\"arithmatex\"\u003E||([0, 100]||)\u003C/marimo-tex\u003E. Because of this 100x scale discrepancy, applying a scaler like \u003Ccode\u003EMinMaxScaler\u003C/code\u003E or \u003Ccode\u003EStandardScaler\u003C/code\u003E is absolutely vital before passing these features to distance-based or gradient-descent algorithms (such as Neural Networks or SVMs), even though Random Forest handles it naturally.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a3aec167e1a398c17690b0d1524b35e6", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"14-combined-knowledge-graph-relation-triples\"\u003E1.4 Combined Knowledge Graph Relation Triples\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThe Yamanishi dataset provides two rich background Knowledge Graphs (KGs) to enable semantic link prediction and knowledge graph embeddings (KGE):\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003Ekegg_kg.txt\u003C/code\u003E\u003C/strong\u003E: Triples extracted from the KEGG database mapping relationships between pathways, genes, drug groups, ATC codes, and EC enzyme numbers.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Ccode\u003Eyamanishi_uniprot_kg.txt\u003C/code\u003E\u003C/strong\u003E: Triples mapping relationships from UniProt, such as protein-protein interactions, protein-disease associations, and gene classifications.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe merge both files to create a unified background Knowledge Graph. These triples are used downstream to train the PyKEEN DistMult model for semantic drug-target embedding representations.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "162430b6315dcfdc3d28fcec711ce85d", "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "cf809b715095cb13f2b9b29d0c811fdf", "console": [], "id": "TqIu", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"knowle ot;Degree (KG Connections)\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]]]' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='true' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch4 id=\"kg-structural-observations-ml-implications\"\u003E\u003Cstrong\u003EKG Structural Observations \u0026amp; ML Implications:\u003C/strong\u003E\u003C/h4\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EScale-Free Network Topology\u003C/strong\u003E:\u003Cul\u003E\n\u003Cli\u003EThe entity connectivity degree histogram (log-scale) shows that while most nodes have very low degrees (1 or 2 connections), a small number of hub nodes have several thousand connections. This is a classic scale-free network.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EHigh DTI Entity Coverage\u003C/strong\u003E:\u003Cul\u003E\n\u003Cli\u003EOver \u003Cstrong\u003E99% of drugs\u003C/strong\u003E and \u003Cstrong\u003E98% of target proteins\u003C/strong\u003E from the gold-standard interactions (\u003Ccode\u003Edt_all_08.txt\u003C/code\u003E) are present in the combined background KG. This is crucial because it ensures that downstream KGE training (e.g. DistMult) will generate dense vector representations for almost all drug-target candidate pairs.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "0e98691dd4621c1130cf6142e477272e", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"2-establishing-a-random-forest-baseline\"\u003E2. Establishing a Random Forest Baseline\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003ERandom Forest is suitable for this problem because:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EHighly Suitable for Tabular Bio-descriptors\u003C/strong\u003E: Random Forest naturally handles high-dimensional, sparse binary features (like 1024-bit Morgan drug fingerprints) and continuous features (like 147-dimensional CTD protein descriptors) without requiring complex neural architectures.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESimplicity\u003C/strong\u003E: Treats DTI prediction as an independent and identically distributed (i.i.d.) tabular classification task, validating our pipeline and feature alignment logic.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EIt serves as a benchmark for comparison before introducing graph embedding or deep learning models.\u003C/span\u003E\n\u003Ch2 id=\"21-warm-start-dataset\"\u003E2.1 Warm-start Dataset\u003C/h2\u003E\n\u003Ch3 id=\"dataset-reconstruction-model-input-format\"\u003EDataset Reconstruction \u0026amp; Model Input Format\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EWe construct a balanced or realistically ratioed tabular dataset where \u003Cstrong\u003Eeach row in the DataFrame represents a single drug-target pair prediction instance\u003C/strong\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPositive Instances (\u003Ccode\u003Elabel = 1.0\u003C/code\u003E)\u003C/strong\u003E: 5,128 verified interactions loaded from \u003Ccode\u003Edt_all_08.txt\u003C/code\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENegative Instances (\u003Ccode\u003Elabel = 0.0\u003C/code\u003E)\u003C/strong\u003E: 51,280 programmatically sampled unobserved pairs (maintaining a realistic \u003Cstrong\u003E1:10 positive-to-negative ratio\u003C/strong\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFinal Features DataFrame (\u003Ccode\u003EX\u003C/code\u003E)\u003C/strong\u003E: A \u003Ccode\u003Epd.DataFrame\u003C/code\u003E of shape \u003Ccode\u003E(56408, 1171)\u003C/code\u003E containing concatenated drug Morgan fingerprints (1024 cols) and scaled target CTD descriptors (147 cols).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETarget Series (\u003Ccode\u003Ey\u003C/code\u003E)\u003C/strong\u003E: A \u003Ccode\u003Epd.Series\u003C/code\u003E of shape \u003Ccode\u003E(56408,)\u003C/code\u003E with binary labels.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70c90aeafb5a8bdc63acd0d6a6029983", "console": [], "id": "ulZA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "989f5377265f03149eba4a9fca5ecab1", "console": [], "id": "ecfG", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"dataset-overview\"\u003EDataset Overview\u003C/h3\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EShape of X: (56397, 1171)\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ESamples of X (5, showing first/last 6 columns):\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='ecfG-0' random-id='6cdcb6f4-82bb-e641-7e64-cd3cdb6c6e1a'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;\u0026#92;\u0026quot;:24645,\u0026#92;\u0026quot;drug_fp_0\u0026#92;\u0026quot;:0.0,\u0026#92;\u0026quot;drug_fp_1\u0026#92;\u0026quot;:0.0,\u0026#92;\u0026quot;drug_fp_2\u0026#92;\u0026quot;:0.0,\u0026#92;\u0026quot;drug_fp_3\u0026#92;\u0026quot;:0.0,\u0026#92;\u0026quot;drug_fp_4\u0026#92;\u0026quot;:0.0,\u002 1189, \u0026#92;\u0026quot;height\u0026#92;\u0026quot;: 490}}}\u0026quot;'\u003E\u003C/marimo-mime-renderer\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"result-interpretation-validation-observations\"\u003EResult Interpretation \u0026amp; Validation Observations\u003C/h3\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EOutstanding Baseline Performance\u003C/strong\u003E:\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EROC-AUC (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.9951||)\u003C/marimo-tex\u003E):\u003C/strong\u003E Demonstrates excellent discriminative ability between interacting and non-interacting drug-target pairs across all classification thresholds.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPR-AUC (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.9791||)\u003C/marimo-tex\u003E):\u003C/strong\u003E Since the dataset is highly imbalanced (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(1:10||)\u003C/marimo-tex\u003E positive-to-negative ratio), the Precision-Recall AUC is a much more robust and honest indicator of performance. Achieving an \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.9791||)\u003C/marimo-tex\u003E PR-AUC indicates the model maintains high precision (low false-positive rate) even at high recall thresholds.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhy is the baseline so strong?\u003C/strong\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EHighly Informative Features:\u003C/strong\u003E Circular Morgan fingerprints represent local chemical neighborhoods that directly dictate binding affinity, while 147-dimensional CTD descriptors represent global physical/chemical signatures of target proteins.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWarm-Start Bipartite Split:\u003C/strong\u003E This standard \u003Cmarimo-tex class=\"arithmatex\"\u003E||(80/20||)\u003C/marimo-tex\u003E split evaluates the model in a \"warm-start\" setting where the individual drugs and target proteins in the test set have been seen during training, just in different pairings. This is expected to yield very high baseline performance. In a \"cold-start\" setting (unseen drugs or unseen proteins), performance would be lower.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "6fe35c8327668e4bfe79debc8f6aaf81", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"22-drug-cold-start-unseen-drugs\"\u003E2.2 Drug Cold-Start (Unseen Drugs)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIn the \u003Cstrong\u003EDrug Cold-Start\u003C/strong\u003E setting, we evaluate the baseline model's ability to extrapolate to entirely novel chemical compounds that were not present in the training set.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis simulates the real-world scenario of screening a newly developed compound library against a set of known target proteins. To achieve a true cold-start partition, we split our unique drug compounds into \u003Cstrong\u003E80% training drugs\u003C/strong\u003E and \u003Cstrong\u003E20% testing drugs\u003C/strong\u003E, ensuring their sets are completely disjoint. Negative pairs are programmatically sampled (1:10 ratio) within each drug set to avoid any information leakage.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5b5a721873dd36af7f50877d54b061d8", "console": [], "id": "nHfw", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3f0f00ca387deac7ccbf8e9a7caea63f", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7954a8d9b54e876db562bed891603faf", "console": [], "id": "AjVT", "outputs": [{"data": {"text/html": "\u003Cdiv style= C (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.8208||)\u003C/marimo-tex\u003E):\u003C/strong\u003E The model retains reasonable rank-ordering ability on unseen drugs, but drops \u003Cstrong\u003E~10.6 percentage points\u003C/strong\u003E from the warm-start (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.9448||)\u003C/marimo-tex\u003E). This tells us that Morgan fingerprints do capture some transferable chemical signal \u2014 the model is not guessing randomly \u2014 but its discriminative power degrades meaningfully when it can no longer rely on having seen a drug in any prior pair.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPR-AUC (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.4972||)\u003C/marimo-tex\u003E):\u003C/strong\u003E This is the more revealing metric. A \u003Cstrong\u003E~27.5 percentage point collapse\u003C/strong\u003E from the warm-start (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.8091||)\u003C/marimo-tex\u003E) indicates the model generates many false positives for novel compounds. At high recall, precision deteriorates sharply (as visible in the PR curve), reflecting that the classifier has not truly learnt generalised structure-activity patterns \u2014 it has partially memorised drug-specific signals.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhat the gap tells us\u003C/strong\u003E:\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EFingerprint Memorisation vs. Generalisation:\u003C/strong\u003E Morgan fingerprints encode local circular substructures. While structurally similar scaffolds share substructure bits, truly novel drugs with unseen scaffolds produce out-of-distribution fingerprint vectors the Random Forest has never split on \u2014 leading to poor calibrated probability estimates.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EImplication for KGE:\u003C/strong\u003E This strong performance drop is precisely the motivation for incorporating \u003Cstrong\u003EKnowledge Graph Embeddings\u003C/strong\u003E. KGE models learn latent relational structure over the drug\u2013protein\u2013pathway graph, which may encode a more transferable and context-aware representation for novel entities than feature-based fingerprints alone.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "0ed070b14acd90daa3d5b40e040a9592", "console": [], "id": "pHFh", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"23-protein-cold-start-unseen-proteins\"\u003E2.3 Protein Cold-Start (Unseen Proteins)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIn the \u003Cstrong\u003EProtein Cold-Start\u003C/strong\u003E setting, we evaluate the baseline model's ability to extrapolate to entirely novel target proteins that were not present in the training set.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis simulates the real-world scenario of predicting candidate compounds for a newly characterized biological receptor or disease target protein. We partition our unique target proteins into \u003Cstrong\u003E80% training proteins\u003C/strong\u003E and \u003Cstrong\u003E20% testing proteins\u003C/strong\u003E. Negative pairs are programmatically sampled (1:10 ratio) within each protein target partition to prevent information leakage.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0db44ca2c7d3d14e012cc60b3e2b8ca6", "console": [], "id": "NCOB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0b905c4f420ac6447c250a1d836f6594", "console": [], "id": "aqbW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a9506667dd6af614f75633805e4768e0", "console": [], "id": "TRpd", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;ju \u003C/strong\u003E Only a \u003Cstrong\u003E~4.4 percentage point\u003C/strong\u003E drop from the warm-start (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.9448||)\u003C/marimo-tex\u003E). The model retains strong rank-ordering ability on entirely unseen proteins \u2014 a much shallower decline than what was observed for unseen drugs (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.8389||)\u003C/marimo-tex\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EPR-AUC (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.8970||)\u003C/marimo-tex\u003E):\u003C/strong\u003E A modest \u003Cstrong\u003E~7.9 percentage point\u003C/strong\u003E decline from the warm-start (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.8091||)\u003C/marimo-tex\u003E). The PR curve remains healthy well into mid-recall before degrading, suggesting the model largely maintains precision when ranking novel targets. This is substantially better than drug cold-start (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.5338||)\u003C/marimo-tex\u003E).\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EA surprising result \u2014 proteins generalise better than drugs\u003C/strong\u003E:\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ECTD Descriptor Transferability:\u003C/strong\u003E 147-dimensional CTD descriptors (composition, transition, distribution over amino acid physicochemical groups) capture global sequence-level physicochemical signatures that are relatively stable across protein families. Even novel proteins share similar bulk properties with training targets, making CTD vectors more transferable than one might expect.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMorgan Fingerprint Sensitivity:\u003C/strong\u003E In contrast, Morgan fingerprints are highly sensitive to local substructure. Novel drug scaffolds produce out-of-distribution bit vectors with little overlap to training compounds, causing the sharper cold-start collapse observed in Section 2.2.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EBiological implication:\u003C/strong\u003E Target proteins in DTI datasets tend to cluster into a small number of families (kinases, GPCRs, ion channels, etc.), so unseen proteins often remain within the same functional and structural neighbourhood as training proteins. Drug chemical space is far more diverse and structurally discontinuous.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "d57dfa55243c17fea7913ab1851b2db0", "console": [], "id": "TXez", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"24-summary\"\u003E2.4 Summary\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "dee215e497c34fb0468c60cbe5afcc7a", "console": [], "id": "dNNg", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"cross-setting-performance-comparison\"\u003ECross-Setting Performance Comparison\u003C/h3\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='dNNg-0' random-id='dd7a2ec4-328b-dbd6-cfe7-bbbd839522a4'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;Evaluation Setting\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Warm-Start (80/20 Bipartite Split)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.9951\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.9791\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Evaluation Setting\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Cold-Start (Unseen Drugs)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.8208\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.4972\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u221217.42 pp\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u221248.19 pp\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Evaluation Setting\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Cold-Start (Unseen Proteins)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.9700\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.8970\u0026#92;\u0026quot;,\u0026#92;\u0026quot;ROC-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u22122.51 pp\u0026#92;\u0026quot;,\u0026#92;\u0026quot;PR-AUC Drop (vs. Warm)\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u22128.21 pp\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='3' data-size-bytes='514' data-total-columns='5' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;Evaluation Setting\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;ROC-AUC\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;PR-AUC\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;ROC-AUC Drop (vs. Warm)\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;PR-AUC Drop (vs. Warm)\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"baseline-generalisation-analysis\"\u003EBaseline Generalisation Analysis\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThe three evaluation settings reveal a clear and informative performance gradient:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E1. Warm-Start inflates performance through pair-level memorisation.\u003C/strong\u003E\nIn the standard 80/20 bipartite split, both drugs and proteins in the test set were seen in training \u2014 just in different pairings. The Random Forest can exploit drug- and protein-specific signals it has memorised, producing an optimistic but unrealistic estimate of real-world performance.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E2. Drug cold-start causes the sharpest collapse.\u003C/strong\u003E\nMorgan fingerprints are highly sensitive to local chemical substructure. Novel drug scaffolds produce out-of-distribution bit-vectors with little overlap to training compounds, causing the model's calibrated probability estimates to degrade severely. At high recall, precision drops sharply \u2014 the model effectively guesses for structurally distant compounds.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E3. Protein cold-start is surprisingly robust.\u003C/strong\u003E\nDespite predicting against entirely unseen proteins, the model retains strong precision well into mid-recall. CTD descriptors capture coarse global physicochemical properties (composition, transition, distribution) that are relatively conserved within protein families. Since DTI target proteins cluster tightly into a small number of families (kinases, GPCRs, ion channels), novel test proteins remain structurally and functionally close to training targets \u2014 making CTD vectors more transferable than Morgan fingerprints are across drug chemical space.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E4. Implication: drug identity is the harder generalisation axis.\u003C/strong\u003E\nFor this baseline, the primary bottleneck is chemical novelty, not biological novelty. This motivates the use of \u003Cstrong\u003EKnowledge Graph Embeddings\u003C/strong\u003E, which can propagate structural and functional context through drug\u2013protein\u2013pathway relational edges, potentially providing a richer and more transferable signal for unseen drugs than fingerprints alone.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "e0eee24e4463ba81486fb91f25597ef2", "console": [], "id": "yCnT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"3-advanced-boosting-baseline-xgboost-classifier\"\u003E3. Advanced Boosting Baseline: XGBoost Classifier\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003ETo build upon the Random Forest baseline, we now introduce \u003Cstrong\u003EXGBoost (Extreme Gradient Boosting)\u003C/strong\u003E.\nGradient Boosted Decision Trees (GBDTs) iteratively build trees to minimize the residual errors of previous trees, which often leads to higher capacity and superior predictive performance for bio-descriptor tabular data.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c54f8a9384b6f40ea83e56ad715be4e6", "console": [], "id": "wlCL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ff2421a16719cebda2d3a2d397e68711", "console": [], "id": "kqZH", "outputs": [{"data": {"tex u003C/strong\u003E due to the structural discontinuity of the Morgan fingerprint space.\u003C/li\u003E\n\u003Cli\u003EBoth remain highly robust on \u003Cstrong\u003EProtein Cold-Start\u003C/strong\u003E because global sequence CTD descriptors generalize well across target receptor families.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThis motivates moving beyond static 2D descriptor vectors to \u003Cstrong\u003Erelational graph embeddings\u003C/strong\u003E like PyKEEN DistMult.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.23.7", "script_metadata_hash": null}, "version": "1"},
